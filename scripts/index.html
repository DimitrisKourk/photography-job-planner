<body class="grid">
    <header class="header">
        <div class="logo-container">
            <img class="logo" src="/management/images/PhotograpyJobPlanner-logo.png" alt="Logo">
            <div id="PageTag">ΑΡΧΙΚΗ</div>
            <div class="settings">
                <img src="images/gear.svg">
            </div>
        </div>
        
    </header>
    <main class="main">
        <div class="date_filter">
            <h4>Φίλτρο:</h4>
            <input type="number" id="yearFilter" name="yearFilter" min="2004" max="2060" style="margin:0">
            <div class="selection-container" id="monthFilter">
                     <div class="custom-select" >
                         <select name="monthFilter" style="margin:0">
                         <option value="1" selected="selected" >Ιανουάριος</option>
                         <option value="2">Φεβρουάριος</option>
                         <option value="3">Μάρτιος</option>
                         <option value="4">Απρίλιος</option>
                         <option value="5">Μάιος</option>
                         <option value="6">Ιούνιος</option>
                         <option value="7">Ιούλιος</option>
                         <option value="8">Άυγουστος</option>
                         <option value="9">Σεπτέμβριος</option>
                         <option value="10">Οκτώβριος</option>
                         <option value="11">Νοέμβριος</option>
                         <option value="12">Δεκέμβριος</option>
                         <option value="0">Όλα</option>
                         </select>
                     </div>
            </div>  
        </div>
        <div class="job-container">
            
        </div>
    </main>

    <nav class="nav">
        <div id="bt-menu" class="bt-menu bt-menu-close">

                <li><a id="dashboard" href="#oikonomika">ΟΙΚΟΝΟΜΙΚΑ</a></li>
                <li><a id="availability" href="#diathesimotita">ΔΙΑΘΕΣΙΜΟΤΗΤΑ</a></li>
            </ul>
        </div>
    </nav>
    <div id="myModal" class="modal"></div>
    <div id="OfferPackageModal" class="modal"></div>
    <div id="OfferPDFSettingsModal"></div>

    <div class="float">
        <img src="images/plus icon.svg" class="My-Float">
    </div>
    <div class="FloatCalendar">
        <img src="images/calendar ICON.png" class="MyCalendar">
    </div>
